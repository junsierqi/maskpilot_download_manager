name: macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      MASKPILOT_MACOS_ARCH: ${{ matrix.arch }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          arch: clang_64
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7'
          archives: 'qtbase qtsvg qttools qttranslations'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install native development dependencies
        run: |
          brew update
          for sdk_package in cmake ninja pkgconf boost curl libxml2 sqlite googletest openssl@3; do
            sdk_prefix=$(brew --prefix "$sdk_package")
            if [ -d "$sdk_prefix" ]; then
              printf 'Retaining installed SDK: %s\n' "$sdk_package"
            else
              brew install "$sdk_package"
            fi
          done
          network_ready() {
            network_prefix=$(brew --prefix curl)
            "$network_prefix/bin/curl" --version | python -c '
          import re, sys
          text = sys.stdin.read()
          versions = re.search(r"^curl ([0-9.]+).*libcurl/([0-9.]+)", text)
          required = {"http", "https", "ftp", "ftps", "sftp"}
          protocols = next((set(line.split()[1:]) for line in text.splitlines() if line.startswith("Protocols:")), set())
          compatible = versions and all(tuple(map(int, value.split("."))) >= (8, 22, 0) for value in versions.groups())
          ready = compatible and required <= protocols
          if not ready:
              print("Native network SDK requires client/runtime 8.22+ and HTTP/HTTPS/FTP/FTPS/SFTP.", file=sys.stderr)
          sys.exit(0 if ready else 1)
          '
          }
          if ! network_ready; then
            brew upgrade curl
          fi
          network_ready
      - name: Prepare isolated Python test tools
        run: |
          python -m venv out/python-macos
          out/python-macos/bin/python -m pip install -r tests/requirements.txt
      - name: Build every target and qualify native paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/qa
          export PYTHON="$PWD/out/python-macos/bin/python"
          trap 'tail -n 120 out/qa/macos-ci.log' EXIT
          bash scripts/verify-macos.sh 2>&1 | tee out/qa/macos-ci.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-${{ matrix.arch }}-qualification
          if-no-files-found: warn
          path: |
            out/qa/macos-*.txt
            out/qa/macos-ci.log
            out/qa/macos-*-unpackaged.tar.gz
            out/build/macos-clang-release/Testing/Temporary/*.log
            out/build/macos-clang-release/CMakeFiles/CMakeConfigureLog.yaml
